apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kibana-portforward
rules:
  - apiGroups: ['']
    resources: ['services']
    resourceNames: ['kibana']
    verbs: ['get']
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list']
  # Pod names change after deployments. Kubernetes RBAC cannot restrict
  # port-forward by label, so this permission covers Pods in logging.
  - apiGroups: ['']
    resources: ['pods/portforward']
    verbs: ['create']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kibana-portforward
subjects:
  - kind: ServiceAccount
    name: monitoring-portforward
    namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kibana-portforward
