apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - prometheus/config.yaml
  - prometheus/workloads.yaml
  - telegraf/config.yaml
  - telegraf/workloads.yaml
configMapGenerator:
  - name: prometheus-config
    behavior: merge
    files:
      - prometheus/alerts.yml
  - name: logging-volume-check
    files:
      - telegraf/logging-volume.conf
      - telegraf/check-logging-volume.sh
