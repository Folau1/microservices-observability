apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-portforward
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitoring-portforward
rules:
  - apiGroups: ['']
    resources: ['services']
    verbs: ['get']
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list']
  - apiGroups: ['']
    resources: ['pods/portforward']
    verbs: ['create']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitoring-portforward
subjects:
  - kind: ServiceAccount
    name: monitoring-portforward
    namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitoring-portforward
