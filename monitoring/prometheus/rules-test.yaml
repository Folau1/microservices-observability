rule_files:
  - alerts.yml
evaluation_interval: 15s
tests:
  - name: existing_app_alert_is_preserved
    interval: 15s
    input_series:
      - series: 'up{job="apps",service="security",instance="security:8000"}'
        values: '0+0x24'
      - series: 'up{job="apps",service="uploader",instance="uploader:8000"}'
        values: '1+0x24'
    alert_rule_test:
      - eval_time: 1m
        alertname: AppServiceDown
        exp_alerts:
          - exp_labels: {service: security, severity: warning}
            exp_annotations:
              summary: 'No available application metrics target'
              description: 'No metrics target is reachable for security, or discovery failed.'
  - name: healthy_filesystems
    interval: 15s
    input_series:
      - series: 'kubernetes_node_fs_available_bytes{host="node2"}'
        values: '50+0x24'
      - series: 'kubernetes_node_fs_capacity_bytes{host="node2"}'
        values: '100+0x24'
      - series: 'logging_volume_mount_present{host="node2"}'
        values: '1+0x24'
      - series: 'logging_volume_available_bytes{host="node2"}'
        values: '50+0x24'
      - series: 'logging_volume_capacity_bytes{host="node2"}'
        values: '100+0x24'
    alert_rule_test:
      - eval_time: 3m
        alertname: LoggingVolumeMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: RootFilesystemLowSpace
        exp_alerts: []
      - eval_time: 3m
        alertname: LoggingVolumeLowSpace
        exp_alerts: []
  - name: missing_volume
    interval: 15s
    input_series:
      - series: 'logging_volume_mount_present{host="node2"}'
        values: '0+0x24'
    alert_rule_test:
      - eval_time: 3m
        alertname: LoggingVolumeMissing
        exp_alerts:
          - exp_labels: {host: node2, severity: critical}
            exp_annotations: {summary: 'Не обнаружен ожидаемый том логирования'}
  - name: low_space
    interval: 15s
    input_series:
      - series: 'kubernetes_node_fs_available_bytes{host="node2"}'
        values: '10+0x24'
      - series: 'kubernetes_node_fs_capacity_bytes{host="node2"}'
        values: '100+0x24'
      - series: 'logging_volume_mount_present{host="node2"}'
        values: '1+0x24'
      - series: 'logging_volume_available_bytes{host="node2"}'
        values: '10+0x24'
      - series: 'logging_volume_capacity_bytes{host="node2"}'
        values: '100+0x24'
    alert_rule_test:
      - eval_time: 3m
        alertname: RootFilesystemLowSpace
        exp_alerts:
          - exp_labels: {host: node2, severity: warning}
            exp_annotations: {summary: 'На корневой файловой системе осталось менее 15%'}
      - eval_time: 3m
        alertname: LoggingVolumeLowSpace
        exp_alerts:
          - exp_labels: {host: node2, severity: warning}
            exp_annotations: {summary: 'На томе логирования осталось менее 20%'}
  - name: restored_mount_resolves_alert
    interval: 15s
    input_series:
      - series: 'logging_volume_mount_present{host="node2"}'
        values: '0+0x8 1+0x16'
    alert_rule_test:
      - eval_time: 1m
        alertname: LoggingVolumeMissing
        exp_alerts:
          - exp_labels: {host: node2, severity: critical}
            exp_annotations: {summary: 'Не обнаружен ожидаемый том логирования'}
      - eval_time: 3m
        alertname: LoggingVolumeMissing
        exp_alerts: []
  - name: missing_metrics
    interval: 15s
    input_series: []
    alert_rule_test:
      - eval_time: 6m
        alertname: RootFilesystemMetricsMissing
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: 'Нет метрик корневой файловой системы'}
      - eval_time: 6m
        alertname: LoggingVolumeMetricsMissing
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: 'Нет метрик тома логирования'}
  - name: both_services_healthy
    interval: 15s
    input_series:
      - series: 'up{job="apps",service="security",pod="security-a"}'
        values: '1+0x8'
      - series: 'up{job="apps",service="uploader",pod="uploader-a"}'
        values: '1+0x8'
    alert_rule_test:
      - eval_time: 2m
        alertname: AppServiceDown
        exp_alerts: []
  - name: one_security_replica_still_healthy
    interval: 15s
    input_series:
      - series: 'up{job="apps",service="security",pod="security-a"}'
        values: '0+0x8'
      - series: 'up{job="apps",service="security",pod="security-b"}'
        values: '1+0x8'
      - series: 'up{job="apps",service="uploader",pod="uploader-a"}'
        values: '1+0x8'
    alert_rule_test:
      - eval_time: 2m
        alertname: AppServiceDown
        exp_alerts: []
  - name: all_security_targets_down
    interval: 15s
    input_series:
      - series: 'up{job="apps",service="security",pod="security-a"}'
        values: '0+0x8'
      - series: 'up{job="apps",service="uploader",pod="uploader-a"}'
        values: '1+0x8'
    alert_rule_test:
      - eval_time: 2m
        alertname: AppServiceDown
        exp_alerts:
          - exp_labels:
              service: security
              severity: warning
            exp_annotations:
              summary: 'No available application metrics target'
              description: 'No metrics target is reachable for security, or discovery failed.'
  - name: missing_security_target
    interval: 15s
    input_series:
      - series: 'up{job="apps",service="uploader",pod="uploader-a"}'
        values: '1+0x8'
    alert_rule_test:
      - eval_time: 2m
        alertname: AppServiceDown
        exp_alerts:
          - exp_labels:
              service: security
              severity: warning
            exp_annotations:
              summary: 'No available application metrics target'
              description: 'No metrics target is reachable for security, or discovery failed.'
  - name: both_targets_absent
    interval: 15s
    input_series: []
    alert_rule_test:
      - eval_time: 2m
        alertname: AppServiceDown
        exp_alerts:
          - exp_labels:
              service: security
              severity: warning
            exp_annotations:
              summary: 'No available application metrics target'
              description: 'No metrics target is reachable for security, or discovery failed.'
          - exp_labels:
              service: uploader
              severity: warning
            exp_annotations:
              summary: 'No available application metrics target'
              description: 'No metrics target is reachable for uploader, or discovery failed.'
  - name: alert_identity_survives_down_target_disappearance
    interval: 15s
    input_series:
      - series: 'up{job="apps",service="security",pod="security-a"}'
        values: '0 0 stale _ _ _ _ _ _'
      - series: 'up{job="apps",service="uploader",pod="uploader-a"}'
        values: '1+0x8'
    alert_rule_test:
      - eval_time: 30s
        alertname: AppServiceDown
        exp_alerts:
          - exp_labels:
              service: security
              severity: warning
            exp_annotations:
              summary: 'No available application metrics target'
              description: 'No metrics target is reachable for security, or discovery failed.'
  - name: synthetic_target_fires_without_stopping_apps
    interval: 15s
    input_series:
      - series: 'up{job="apps",service="security",pod="security-a"}'
        values: '1+0x8'
      - series: 'up{job="apps",service="uploader",pod="uploader-a"}'
        values: '1+0x8'
      - series: 'up{job="apps",service="controlled-alert-test",pod="controlled-alert-test"}'
        values: '0+0x8'
    alert_rule_test:
      - eval_time: 2m
        alertname: AppServiceDown
        exp_alerts:
          - exp_labels: {service: controlled-alert-test, severity: warning}
            exp_annotations:
              summary: 'No available application metrics target'
              description: 'No metrics target is reachable for controlled-alert-test, or discovery failed.'
