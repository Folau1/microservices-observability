# Apply separately: the parent monitoring Kustomization sets namespace
# observability, while these permissions must remain in microservices.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-discovery
  namespace: microservices
rules:
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-discovery
  namespace: microservices
subjects:
  - kind: ServiceAccount
    name: prometheus-pod-discovery
    namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-pod-discovery
