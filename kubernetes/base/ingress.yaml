apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/security
            pathType: Prefix
            backend:
              service:
                name: security
                port: {number: 8000}
          - path: /api/uploader
            pathType: Prefix
            backend:
              service:
                name: uploader
                port: {number: 8000}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: {number: 8080}
